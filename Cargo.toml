[package]
name = "bifrost-ssh"
version = "0.1.0"
edition = "2024"
description = "Beginner-friendly SSH TUI: connections, keys, jump hosts and port forwards"
publish = false

[[bin]]
name = "bifrost"
path = "src/main.rs"

[dependencies]
# Argument parsing, --help/--version and usage errors. Default features are off
# to skip color, suggestions and env support, which Bifrost does not need.
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
# Derives (de)serialization for the Bifrost store schema.
serde = { version = "1", features = ["derive"] }
# Reads and writes the TOML store. Only parsing, serializing and serde support.
toml = { version = "1", default-features = false, features = [
    "std",
    "parse",
    "display",
    "serde",
] }

[dev-dependencies]
# Temporary directories (removed on drop) so tests never touch the real config dir.
tempfile = "3"
