[package]
name = "bifrost-ssh"
version = "0.1.0"
edition = "2024"
# The oldest compiler that builds and passes the whole test suite: ratatui 0.30
# needs 1.88, and so do the `if let ... && let` chains in the code. CI builds with
# exactly this version, so the number cannot drift without a failing job.
rust-version = "1.88"
description = "Beginner-friendly SSH TUI: connections, keys, jump hosts and port forwards"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blokxz/bifrost"
readme = "README.md"
keywords = ["ssh", "tui", "terminal", "ssh-config", "ssh-keys"]
categories = ["command-line-utilities", "network-programming"]
# What is published: the source (whose unit tests are in the files themselves),
# the lock file so that `cargo install --locked` builds what was tested, and the
# documents. The integration tests, their fixtures, the interface mockups and the
# CI files stay in the repository.
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/docs/DECISIONS.md",
]

[[bin]]
name = "bifrost"
path = "src/main.rs"

[dependencies]
# Argument parsing, --help/--version and usage errors. Default features are off
# to skip color, suggestions and env support, which Bifrost does not need.
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
# Terminal rendering and the TestBackend used to test screens. Default features
# are off: no proc-macro crate, no calendar widget (pulls `time`), no layout
# cache and no underline colors. The crossterm backend is the only one enabled
# and crossterm itself is used through `ratatui::crossterm`, so the dependency
# tree holds exactly one copy of it.
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
] }
# Derives (de)serialization for the Bifrost store schema.
serde = { version = "1", features = ["derive"] }
# Reads and writes the TOML store. Only parsing, serializing and serde support.
toml = { version = "1", default-features = false, features = [
    "std",
    "parse",
    "display",
    "serde",
] }

[target.'cfg(unix)'.dependencies]
# Keeps Bifrost alive when Ctrl-C reaches ssh's process group while ssh has the
# terminal (a password prompt, a hanging connection). The handler it installs
# is reset to the default on exec, so ssh itself still dies on Ctrl-C, which a
# plain "ignore SIGINT" would not allow. Already in the tree through crossterm,
# so it adds no crate. Registering a handler needs no `unsafe` on our side.
signal-hook = { version = "0.3", default-features = false }
# Saves the terminal's modes before ssh runs and puts them back afterwards, so an
# ssh that dies in raw mode (SIGKILL, out of memory) cannot leave the terminal
# raw. crossterm re-captures "the original modes" on every enable_raw_mode and
# would otherwise restore the wrong ones at exit. Also ends the whole process
# group of an `ssh -G` (or `ssh-add`) that missed its deadline, so that a hanging
# `Match exec` command does not outlive it (`process` is the feature for that).
# Already in the tree through crossterm, so it adds no crate.
rustix = { version = "1", default-features = false, features = ["std", "termios", "process"] }

[dev-dependencies]
# Temporary directories (removed on drop) so tests never touch the real config dir.
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
# Opens a pseudo-terminal so the tests/pty*.rs files can run the real binary in
# a real terminal, and sends it signals. Safe wrappers only, so the test code
# needs no `unsafe`. It is already in the tree through crossterm (this only
# enables its `fs`, `process`, `pty` and `termios` features), and Windows never
# builds it: those tests are Unix-only.
rustix = { version = "1", features = ["fs", "process", "pty", "termios"] }
