# Fixture for the import tests. Every host below is resolved with `ssh -G`;
# the canned outputs live in g/<name>.txt.

Host bastion
    HostName bastion.example.com
    User admin
    Port 2222
    IdentityFile ~/keys/bastion_ed25519

Host web
    HostName web.example.com
    User deploy
    ProxyJump bastion
    ForwardAgent yes
    RemoteForward 9090 localhost:3000

Host db
    HostName 10.0.0.5
    ProxyJump bastion
    LocalForward 5433 localhost:5432
    LocalForward 0.0.0.0:8080 localhost:80
    DynamicForward 1080

Host legacy
    HostName legacy.example.com
    ProxyCommand nc -X 5 -x proxy.example.com:1080 %h %p

Host multikey
    HostName multi.example.com
    IdentityFile ~/keys/first
    IdentityFile ~/keys/second

Host chain
    HostName chain.example.com
    ProxyJump bastion,web

Host bad_host
    HostName under_score.example.com

Host plain
    HostName plain.example.com

Host host:2222

Host *.internal !secret
    User internal

Host *
    ServerAliveInterval 30
