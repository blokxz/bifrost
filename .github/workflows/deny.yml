name: Dependencies

# `cargo deny` checks the dependencies against deny.toml: known vulnerabilities
# (RustSec), yanked releases, licenses, banned crates and where crates come from.
# Advisories are published after a release is made, so this also runs every week:
# a new one shows up here without anybody having to push.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The action's own default is an older Rust. `cargo deny` only asks cargo
          # for the dependency graph, so the current stable is the one that can read
          # every manifest in it.
          rust-version: stable
          command: check
          arguments: --locked
