name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Show toolchain
        run: rustc --version --verbose && cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # The pseudo-terminal tests race real processes and signals, so one green run
  # proves little. This repeats them to catch flakiness. A separate job, so the
  # normal run stays fast; Ubuntu only, because pseudo-terminals are Unix only.
  pty-stability:
    name: pty tests x20
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Build the tests once
        run: cargo test --locked --test pty --test pty_connect --test pty_keys --test pty_sshconfig --test import_timeout --test connect --test cli_connect --no-run

      - name: Run them 20 times
        run: |
          for run in $(seq 1 20); do
            echo "::group::run $run of 20"
            cargo test --locked --test pty --test pty_connect --test pty_keys --test pty_sshconfig --test import_timeout --test connect --test cli_connect
            echo "::endgroup::"
          done
